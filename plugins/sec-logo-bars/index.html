<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SEC Logo Bars</title>
<!--
  SEC Logo Bars -- a Sigma custom-viz plugin.

  A bar chart where every bar is painted in its team's colors and carries the
  team's logo. Bind any element with a text column of team names and a numeric
  column; the plugin matches the names against a registry of the 16 SEC
  programs (nicknames, abbreviations and mascots included) and falls back to a
  monogram badge for anything it doesn't recognize, so an unmatched row is
  still a readable bar.

  Single file, no build step. The SDK comes from unpkg as a UMD bundle and is
  read off window.SigmaPlugin.client -- see the note by `var sdk`, because the
  commonly-copied global does not exist. Logos are ESPN's public team-logo CDN;
  each <img> has an onerror that swaps in the monogram, so a blocked or
  offline CDN degrades instead of leaving holes.

  Opens directly in a browser with no Sigma client at all, for iteration.
-->
<script src="https://unpkg.com/@sigmacomputing/plugin"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,Arial,sans-serif;
       overflow:hidden;color:#0f172a;background:transparent}

  /* Two themes. Everything downstream reads these variables, so a theme
     switch never needs to touch the row-building code. */
  #wrap{--bg:#0b1220;--panel:#101a2e;--ink:#f8fafc;--dim:#94a3b8;--line:rgba(255,255,255,.10);
        --track:rgba(255,255,255,.06);--chip:#ffffff;
        height:100%;display:flex;flex-direction:column;gap:10px;padding:14px 16px;
        background:var(--bg);color:var(--ink);position:relative;overflow:hidden}
  #wrap.day{--bg:#ffffff;--panel:#f8fafc;--ink:#0f172a;--dim:#64748b;--line:rgba(15,23,42,.10);
            --track:rgba(15,23,42,.05);--chip:#ffffff}

  /* Yard lines: a stadium cue that stays out of the way of the data. */
  #field{position:absolute;inset:0;pointer-events:none;opacity:.5;
         background:repeating-linear-gradient(90deg,transparent 0 11.11%,var(--line) 11.11% calc(11.11% + 1px))}
  #wrap.day #field{opacity:.6}

  #top{position:relative;display:flex;align-items:center;gap:10px;flex:0 0 auto}
  #mark{font-size:11px;font-weight:900;letter-spacing:.14em;padding:3px 7px;border-radius:4px;
        background:linear-gradient(135deg,#0b3d91,#c8102e);color:#fff;flex:0 0 auto}
  #ttl{font-size:14px;font-weight:800;letter-spacing:.02em;white-space:nowrap;
       overflow:hidden;text-overflow:ellipsis}
  #sub{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);
       margin-left:auto;white-space:nowrap;flex:0 0 auto}
  #badge{font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
         padding:2px 6px;border-radius:3px;background:#fef3c7;color:#92400e;display:none;flex:0 0 auto}
  #badge.on{display:inline-block}

  #plot{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;gap:4px}
  .more{flex:0 0 auto;font-size:9px;font-weight:700;letter-spacing:.04em;color:var(--dim);
        padding-left:2px}
  #empty{flex:1;display:flex;align-items:center;justify-content:center;padding:0 24px;
         font-size:11px;color:var(--dim);text-align:center;line-height:1.6}

  /* ---- horizontal bars ---- */
  .row{display:grid;grid-template-columns:var(--rankw,18px) 1fr minmax(34px,auto);
       gap:8px;align-items:center;flex:0 0 auto}
  .rank{font-size:10px;font-weight:800;color:var(--dim);text-align:right;
        font-variant-numeric:tabular-nums}
  .track{position:relative;height:100%;border-radius:5px;
         background:var(--track);overflow:visible}
  .fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px;min-width:6px;
        background:linear-gradient(100deg,var(--p) 0%,var(--p) 42%,var(--s) 100%);
        box-shadow:0 1px 3px rgba(0,0,0,.28);
        display:flex;align-items:center;gap:7px;padding:0 8px 0 3px;overflow:hidden;
        transition:width .45s cubic-bezier(.22,.8,.28,1)}
  .name{font-size:11px;font-weight:800;letter-spacing:.01em;color:var(--t);white-space:nowrap;
        text-shadow:0 1px 1px rgba(0,0,0,.18)}
  /* When the bar is too short to hold the logo and name, they hop outside it
     and take the panel's ink color instead of the on-bar color. */
  .row.narrow .fill{padding:0;overflow:visible}
  .row.narrow .name{display:none}
  .row.narrow .fill .logo{display:none}
  .out{display:none;position:absolute;top:50%;transform:translateY(-50%);
       align-items:center;gap:6px;font-size:11px;font-weight:800;color:var(--ink);white-space:nowrap}
  .row.narrow .out{display:flex}
  .val{font-size:11px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;
       text-align:right;white-space:nowrap}

  /* ---- the logo badge ---- */
  .logo{flex:0 0 auto;position:relative;border-radius:50%;background:var(--chip);
        display:flex;align-items:center;justify-content:center;overflow:hidden;
        box-shadow:0 1px 2px rgba(0,0,0,.3),0 0 0 1.5px rgba(255,255,255,.85)}
  .logo img{width:78%;height:78%;object-fit:contain;display:block}
  .logo .mono{font-size:9px;font-weight:900;letter-spacing:-.02em;color:#0f172a}

  /* ---- vertical columns ---- */
  #plot.cols{flex-direction:row;align-items:flex-end;gap:6px;padding-bottom:2px}
  .col{flex:1 1 0;min-width:0;height:100%;display:flex;flex-direction:column;
       align-items:center;justify-content:flex-end;gap:4px}
  .col .cval{font-size:10px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
  .col .bar{width:100%;max-width:56px;border-radius:5px 5px 3px 3px;min-height:3px;
            background:linear-gradient(185deg,var(--p) 0%,var(--p) 45%,var(--s) 100%);
            box-shadow:0 -1px 3px rgba(0,0,0,.25);
            transition:height .45s cubic-bezier(.22,.8,.28,1)}
  .col .cabbr{font-size:9px;font-weight:800;letter-spacing:.06em;color:var(--dim);
              white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
</style>
</head>
<body>
<div id="wrap">
  <div id="field"></div>
  <div id="top">
    <div id="mark">SEC</div>
    <div id="ttl">SEC Logo Bars</div>
    <div id="badge">demo data</div>
    <div id="sub"></div>
  </div>
  <div id="plot"></div>
</div>
<script>
(function(){
  "use strict";

  // The UMD bundle defines exactly one global: `SigmaPlugin`, with the
  // imperative client at `SigmaPlugin.client`. `window.sigmaComputing.plugin`
  // is a widely-copied pattern that no published bundle defines -- a plugin
  // reading it gets client === null and renders its demo fallback forever,
  // looking fine in a screenshot while binding nothing. The legacy path stays
  // in the chain only so an older bundle that did export it would still work.
  var sdk = window.SigmaPlugin
         || (window.sigmaComputing && window.sigmaComputing.plugin)
         || null;
  var client = (sdk && sdk.client) || null;

  // --- Team registry ------------------------------------------------------
  // espn: id on ESPN's public logo CDN. p/s: bar gradient, official primary
  // into a complementary secondary. Aliases are matched after normalization,
  // so only distinguishing ones are listed -- shared mascots ("Tigers",
  // "Bulldogs", "Wildcats" where two programs collide) are deliberately absent
  // rather than guessed at.
  var TEAMS = [
    {key:'alabama',  name:'Alabama',          abbr:'ALA',  espn:333,  p:'#9E1B32', s:'#63121F',
     alias:['bama','crimson tide','alabama crimson tide','roll tide','university of alabama','u of a']},
    {key:'arkansas', name:'Arkansas',         abbr:'ARK',  espn:8,    p:'#9D2235', s:'#6B1725',
     alias:['razorbacks','arkansas razorbacks','woo pig','hogs','university of arkansas']},
    {key:'auburn',   name:'Auburn',           abbr:'AUB',  espn:2,    p:'#0C2340', s:'#E87722',
     alias:['auburn tigers','war eagle','au','auburn university']},
    {key:'florida',  name:'Florida',          abbr:'FLA',  espn:57,   p:'#0021A5', s:'#FA4616',
     alias:['gators','florida gators','uf','university of florida']},
    {key:'georgia',  name:'Georgia',          abbr:'UGA',  espn:61,   p:'#BA0C2F', s:'#000000',
     alias:['uga','georgia bulldogs','dawgs','university of georgia']},
    {key:'kentucky', name:'Kentucky',         abbr:'UK',   espn:96,   p:'#0033A0', s:'#00205B',
     alias:['uk','kentucky wildcats','big blue','university of kentucky']},
    {key:'lsu',      name:'LSU',              abbr:'LSU',  espn:99,   p:'#461D7C', s:'#FDD023',
     alias:['louisiana state','louisiana state university','lsu tigers','geaux tigers']},
    {key:'missst',   name:'Mississippi State',abbr:'MSST', espn:344,  p:'#5D1725', s:'#3D0F18',
     alias:['miss state','miss st','mississippi st','msu','msstate','mississippi state bulldogs','hail state']},
    {key:'missouri', name:'Missouri',         abbr:'MIZ',  espn:142,  p:'#F1B82D', s:'#000000',
     alias:['mizzou','missouri tigers','university of missouri','mu']},
    {key:'oklahoma', name:'Oklahoma',         abbr:'OU',   espn:201,  p:'#841617', s:'#5C0F10',
     alias:['ou','sooners','oklahoma sooners','boomer sooner','university of oklahoma']},
    {key:'olemiss',  name:'Ole Miss',         abbr:'MISS', espn:145,  p:'#14213D', s:'#CE1126',
     alias:['mississippi','rebels','ole miss rebels','hotty toddy','university of mississippi']},
    {key:'southcar', name:'South Carolina',   abbr:'SC',   espn:2579, p:'#73000A', s:'#3F0006',
     alias:['gamecocks','south carolina gamecocks','sc','uofsc','university of south carolina']},
    {key:'tennessee',name:'Tennessee',        abbr:'TENN', espn:2633, p:'#FF8200', s:'#58595B',
     alias:['vols','volunteers','tenn','tennessee volunteers','rocky top','university of tennessee']},
    {key:'texas',    name:'Texas',            abbr:'TEX',  espn:251,  p:'#BF5700', s:'#333F48',
     alias:['longhorns','texas longhorns','hook em','university of texas']},
    {key:'texasam',  name:'Texas A&M',        abbr:'TAMU', espn:245,  p:'#500000', s:'#2E0000',
     alias:['texas am','texas a and m','tamu','a&m','am','aggies','texas a&m aggies','gig em']},
    {key:'vandy',    name:'Vanderbilt',       abbr:'VAN',  espn:238,  p:'#866D4B', s:'#000000',
     alias:['vandy','commodores','vanderbilt commodores','anchor down','vanderbilt university']}
  ];

  // Normalize aggressively so "Texas A&M Aggies", "TEXAS_A_AND_M" and
  // "texas a&m " all land on the same key.
  function norm(s){
    return String(s == null ? '' : s)
      .toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .replace(/&/g,' and ')
      .replace(/[^a-z0-9]+/g,' ')
      .replace(/\buniversity of\b|\buniversity\b|\bthe\b|\bfootball\b|\bteam\b/g,' ')
      .replace(/\s+/g,' ')
      .trim();
  }

  var INDEX = (function(){
    var m = Object.create(null);
    TEAMS.forEach(function(t){
      [t.name, t.abbr, t.key].concat(t.alias || []).forEach(function(a){
        var n = norm(a);
        if (n && !(n in m)) m[n] = t;
      });
    });
    return m;
  })();

  function lookup(raw){
    var n = norm(raw);
    if (!n) return null;
    if (INDEX[n]) return INDEX[n];
    // Substring pass, longest key first, so "Alabama Crimson Tide 2024" still
    // resolves and "miss" never wins over "mississippi state".
    var keys = Object.keys(INDEX).sort(function(a,b){ return b.length - a.length; });
    for (var i = 0; i < keys.length; i++){
      if (keys[i].length >= 3 && n.indexOf(keys[i]) !== -1) return INDEX[keys[i]];
    }
    return null;
  }

  // Anything unmatched still gets a bar: neutral SEC-ish gradient, monogram
  // instead of a logo. Deterministic hue from the label so the same unknown
  // team keeps the same color between renders.
  function unknownTeam(label){
    var h = 0, str = norm(label) || 'x';
    for (var i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
    var hue = h % 360;
    var mono = str.split(' ').map(function(w){ return w.charAt(0); }).join('')
                  .slice(0,3).toUpperCase() || '?';
    return { key:'?'+str, name:String(label), abbr:mono, espn:null,
             p:'hsl('+hue+',42%,38%)', s:'hsl('+hue+',42%,22%)', unknown:true };
  }

  var LOGO = 'https://a.espncdn.com/i/teamlogos/ncaa/500/';

  // Text on a bar: luminance decides black or white. Missouri gold and
  // Vanderbilt anchor gold need dark text; Tennessee orange does not.
  function onColor(hex){
    var m = /^#?([0-9a-f]{6})$/i.exec(hex);
    if (!m) return '#ffffff';
    var v = parseInt(m[1], 16);
    var c = [(v>>16)&255, (v>>8)&255, v&255].map(function(x){
      x /= 255; return x <= 0.03928 ? x/12.92 : Math.pow((x+0.055)/1.055, 2.4);
    });
    var L = 0.2126*c[0] + 0.7152*c[1] + 0.0722*c[2];
    return L > 0.45 ? '#111827' : '#ffffff';
  }

  // --- Editor panel -------------------------------------------------------
  // Each `name` is both the config key here and the key a workbook spec's
  // plugin `config` must use -- renaming one silently unbinds every workbook
  // already bound to this plugin.
  var DEFS = [
    { name:'source', type:'element' },
    { name:'team',   type:'column', source:'source', label:'Team', allowedTypes:['text'] },
    { name:'value',  type:'column', source:'source', label:'Value',
      allowedTypes:['number','integer'] },
    { name:'title',  type:'text', label:'Title', defaultValue:'SEC Standings' },
    { name:'layout', type:'dropdown', label:'Layout',
      values:['Horizontal bars','Vertical columns'], defaultValue:'Horizontal bars' },
    { name:'theme',  type:'dropdown', label:'Theme',
      values:['Night','Day'], defaultValue:'Night' },
    { name:'sort',   type:'dropdown', label:'Sort',
      values:['Value, high to low','Value, low to high','Team A-Z'],
      defaultValue:'Value, high to low' },
    { name:'format', type:'dropdown', label:'Value format',
      values:['Auto','Whole number','One decimal','Percent','Currency'],
      defaultValue:'Auto' },
    { name:'showRank', type:'toggle', label:'Show rank', defaultValue:true },
    { name:'maxBars',  type:'text',   label:'Max bars',  defaultValue:'16' }
  ];
  if (client) client.config.configureEditorPanel(DEFS);

  // --- Formatting ---------------------------------------------------------
  function fmt(v, mode){
    v = Number(v) || 0;
    if (mode === 'Whole number') return Math.round(v).toLocaleString();
    if (mode === 'One decimal')  return v.toFixed(1);
    if (mode === 'Percent')      return (Math.abs(v) <= 1 ? v*100 : v).toFixed(1) + '%';
    if (mode === 'Currency'){
      var a = Math.abs(v);
      if (a >= 1e9) return '$' + (v/1e9).toFixed(1) + 'B';
      if (a >= 1e6) return '$' + (v/1e6).toFixed(1) + 'M';
      if (a >= 1e3) return '$' + (v/1e3).toFixed(1) + 'k';
      return '$' + v.toFixed(0);
    }
    var abs = Math.abs(v);                        // Auto
    if (abs >= 1e9) return (v/1e9).toFixed(1) + 'B';
    if (abs >= 1e6) return (v/1e6).toFixed(1) + 'M';
    if (abs >= 1e3) return (v/1e3).toFixed(1) + 'k';
    if (!Number.isInteger(v) && abs < 100) return v.toFixed(1);
    return String(Math.round(v));
  }

  function logoEl(team, px){
    var d = document.createElement('div');
    d.className = 'logo';
    d.style.width = px + 'px'; d.style.height = px + 'px';
    var mono = document.createElement('span');
    mono.className = 'mono'; mono.textContent = team.abbr;
    mono.style.fontSize = Math.max(7, Math.round(px * 0.34)) + 'px';
    if (team.espn){
      var img = document.createElement('img');
      img.alt = team.name;
      img.referrerPolicy = 'no-referrer';   // some CDNs refuse hotlinked referrers
      img.src = LOGO + team.espn + '.png';
      // A blocked or offline CDN degrades to the monogram instead of a hole.
      img.onerror = function(){ img.remove(); d.appendChild(mono); };
      d.appendChild(img);
    } else {
      d.appendChild(mono);
    }
    return d;
  }

  // --- Rendering ----------------------------------------------------------
  var plot = document.getElementById('plot');

  function showEmpty(msg){
    plot.className = '';
    plot.innerHTML = '';
    var e = document.createElement('div');
    e.id = 'empty'; e.textContent = msg;
    plot.appendChild(e);
  }

  function drawBars(rows, cfg){
    plot.className = '';
    plot.innerHTML = '';
    var max = rows.reduce(function(m,r){ return Math.max(m, r.value); }, 0) || 1;
    var rankW = cfg.showRank === false ? 0 : 18;
    plot.style.setProperty('--rankw', rankW + 'px');
    // Fit every bar in the box we actually have. Flexing them instead let a
    // 16-team chart in a short element overflow and clip the last row. Below
    // MINH a bar stops being readable, so a box that can't hold them all keeps
    // as many as fit and says how many it dropped -- never silently.
    var n = rows.length;
    var gap = n > 10 ? 3 : 5;
    var MINH = 12;
    plot.style.gap = gap + 'px';
    var box = plot.clientHeight;
    var cap = Math.max(1, Math.floor((box + gap) / (MINH + gap)));
    var hidden = 0;
    if (n > cap){
      hidden = n - (cap - 1);
      rows = rows.slice(0, Math.max(1, cap - 1));
      n = rows.length;
    }
    var avail = Math.max(0, box - gap * (n - 1) - (hidden ? 14 + gap : 0));
    var h = Math.max(MINH, Math.min(40, Math.floor(avail / n)));
    var badge = Math.max(11, Math.min(30, h - 3));
    var fs = Math.max(8, Math.min(12, Math.round(h * 0.46)));

    rows.forEach(function(r, i){
      var t = r.team;
      var row = document.createElement('div');
      row.className = 'row';
      row.style.height = h + 'px';
      row.style.fontSize = fs + 'px';
      row.style.setProperty('--p', t.p);
      row.style.setProperty('--s', t.s);
      row.style.setProperty('--t', onColor(t.p));
      row.title = t.name + ' — ' + fmt(r.value, cfg.format);

      if (rankW){
        var rk = document.createElement('div');
        rk.className = 'rank'; rk.textContent = String(i + 1);
        rk.style.fontSize = Math.max(8, fs - 1) + 'px';
        row.appendChild(rk);
      }

      var track = document.createElement('div');
      track.className = 'track';
      var fill = document.createElement('div');
      fill.className = 'fill';
      var pct = Math.max(0, Math.min(100, (r.value / max) * 100));
      fill.style.width = pct + '%';
      fill.appendChild(logoEl(t, badge));
      var nm = document.createElement('div');
      nm.className = 'name'; nm.textContent = t.name;
      nm.style.fontSize = fs + 'px';
      fill.appendChild(nm);
      track.appendChild(fill);

      // Short-bar escape hatch, populated up front so the measure pass below
      // only has to toggle a class.
      var out = document.createElement('div');
      out.className = 'out';
      out.appendChild(logoEl(t, badge));
      var onm = document.createElement('span');
      onm.textContent = t.name;
      out.appendChild(onm);
      out.style.left = 'calc(' + pct + '% + 6px)';
      out.style.fontSize = fs + 'px';
      track.appendChild(out);
      row.appendChild(track);

      var val = document.createElement('div');
      val.className = 'val'; val.textContent = fmt(r.value, cfg.format);
      val.style.fontSize = fs + 'px';
      row.appendChild(val);
      plot.appendChild(row);

      // Measured, not guessed: the name's width depends on the font the host
      // actually resolved, so ask the DOM after layout.
      requestAnimationFrame(function(){
        var need = badge + 14 + nm.scrollWidth;
        if (fill.clientWidth < need) row.className = 'row narrow';
      });
    });

    if (hidden){
      var more = document.createElement('div');
      more.className = 'more';
      more.textContent = '+' + hidden + ' more — make this element taller';
      plot.appendChild(more);
    }
  }

  function drawCols(rows, cfg){
    plot.className = 'cols';
    plot.innerHTML = '';
    var max = rows.reduce(function(m,r){ return Math.max(m, r.value); }, 0) || 1;
    var w = plot.clientWidth / Math.max(1, rows.length);
    var badge = Math.max(14, Math.min(34, Math.floor(w * 0.6)));

    rows.forEach(function(r){
      var t = r.team;
      var col = document.createElement('div');
      col.className = 'col';
      col.style.setProperty('--p', t.p);
      col.style.setProperty('--s', t.s);
      col.title = t.name + ' — ' + fmt(r.value, cfg.format);

      var v = document.createElement('div');
      v.className = 'cval'; v.textContent = fmt(r.value, cfg.format);
      col.appendChild(v);
      col.appendChild(logoEl(t, badge));

      var bar = document.createElement('div');
      bar.className = 'bar';
      // Reserve room for the value, logo and label that sit outside the bar.
      var room = Math.max(10, plot.clientHeight - (badge + 34));
      bar.style.height = Math.max(3, (r.value / max) * room) + 'px';
      col.appendChild(bar);

      var ab = document.createElement('div');
      ab.className = 'cabbr'; ab.textContent = w < 46 ? t.abbr : t.name;
      col.appendChild(ab);
      plot.appendChild(col);
    });
  }

  function render(rows, isDemo, cfg){
    cfg = cfg || {};
    document.getElementById('wrap').className = (cfg.theme === 'Day') ? 'day' : '';
    document.getElementById('ttl').textContent = cfg.title || 'SEC Logo Bars';
    document.getElementById('badge').className = isDemo ? 'on' : '';
    document.getElementById('sub').textContent = isDemo ? '' : (cfg.valueName || '');

    if (!rows || !rows.length){
      showEmpty('Bind an element, a team column and a value column in the editor panel.');
      return;
    }
    var n = parseInt(cfg.maxBars, 10);
    if (!isFinite(n) || n <= 0) n = 16;

    rows = rows.slice();
    if (cfg.sort === 'Team A-Z')            rows.sort(function(a,b){ return a.team.name.localeCompare(b.team.name); });
    else if (cfg.sort === 'Value, low to high') rows.sort(function(a,b){ return a.value - b.value; });
    else                                    rows.sort(function(a,b){ return b.value - a.value; });
    rows = rows.slice(0, n);

    if (cfg.layout === 'Vertical columns') drawCols(rows, cfg);
    else                                   drawBars(rows, cfg);
  }

  // --- Demo fallback ------------------------------------------------------
  // Deterministic and badged: a plugin that reshuffles per render can't be
  // eyeballed for regressions, and unbadged demo numbers get mistaken for
  // real ones. If this shows up inside Sigma, the binding is wrong.
  function demo(){
    var wins = {georgia:11, texas:11, olemiss:10, tennessee:10, alabama:9, southcar:9,
                missouri:9, texasam:8, lsu:8, florida:7, arkansas:6, oklahoma:6,
                vandy:6, auburn:5, kentucky:4, missst:2};
    return TEAMS.map(function(t){ return { team:t, value:wins[t.key] }; });
  }

  // --- Data wiring --------------------------------------------------------
  // subscribeToElementData yields an object keyed by column ID, each value a
  // parallel array of cells -- not an array of row objects. Zip by index.
  function toRows(data, cfg){
    if (!data || !cfg || !cfg.team || !cfg.value) return null;
    var names = data[cfg.team], vals = data[cfg.value];
    if (!names || !vals) return null;

    // Sum duplicate teams so a raw, ungrouped element still charts sensibly.
    var byKey = Object.create(null), order = [];
    for (var i = 0; i < vals.length; i++){
      var v = Number(vals[i]);
      if (!isFinite(v)) continue;
      var raw = names[i];
      if (raw === null || raw === undefined || raw === '') continue;
      var team = lookup(raw) || unknownTeam(raw);
      if (byKey[team.key]) { byKey[team.key].value += v; continue; }
      byKey[team.key] = { team:team, value:v };
      order.push(team.key);
    }
    var out = order.map(function(k){ return byKey[k]; });
    return out.length ? out : null;
  }

  var state = { cfg:null, data:null, unsub:null, unsubCols:null, valueName:'' };

  function recompute(){
    var cfg = state.cfg || {};
    cfg.valueName = state.valueName;
    var rows = toRows(state.data, cfg);
    if (rows) render(rows, false, cfg);
    else if (cfg.source) render(null, false, cfg);   // bound, still loading
    else render(demo(), true, cfg);                  // nothing bound -> demo
  }

  if (client){
    client.config.subscribe(function(cfg){
      state.cfg = cfg || {};
      // Drop the previous element subscriptions before opening new ones, or
      // re-binding the source leaks a listener that keeps overwriting
      // state.data with the old element's rows.
      if (state.unsub){ state.unsub(); state.unsub = null; }
      if (state.unsubCols){ state.unsubCols(); state.unsubCols = null; }
      state.data = null; state.valueName = '';
      if (state.cfg.source){
        state.unsub = client.elements.subscribeToElementData(
          state.cfg.source, function(d){ state.data = d; recompute(); });
        // Column metadata is a nicety (it labels the measure in the header),
        // so an SDK without it must not take the chart down with it.
        try {
          state.unsubCols = client.elements.subscribeToElementColumns(
            state.cfg.source, function(cols){
              var c = cols && state.cfg.value && cols[state.cfg.value];
              state.valueName = (c && (c.name || c.label)) || '';
              recompute();
            });
        } catch (e) { /* optional */ }
      }
      recompute();
    });
  } else {
    recompute();
  }

  // Bar geometry is computed from the measured plot box, so a resized element
  // has to re-render rather than just reflow.
  var t = null;
  window.addEventListener('resize', function(){
    clearTimeout(t);
    t = setTimeout(recompute, 120);
  });
})();
</script>
</body>
</html>
